name: ci

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

      # 与 publish.yml 的冒烟保持一致：证明打包产物可安装可运行
      - name: Build and smoke-test the wheel
        run: |
          uv build
          uv venv --python 3.12 /tmp/probe
          uv pip install --python /tmp/probe/bin/python dist/*.whl
          /tmp/probe/bin/postel-studio version
